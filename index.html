<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <title>LoL Damage Calculator</title>
    </head>
    <body>
        
        <!-- Version 2 Info -->
        <h1>League of Legends Damage Calculator</h1>
       <section>
    <h2>Offense</h2>

    <label for="offenseChampion">Champion:</label>
    <select id="offenseChampion" name="offenseChampion">
        <option value="">Select Champion</option>
    </select>

    <label for="offenseLevel">Level:</label>
    <select id="offenseLevel" name="offenseLevel">
        <option value="1">1</option>
        <option value="2">2</option>
        <!-- continue to 18 -->
    </select>

    <label for="ability">Ability:</label>
    <select id="ability" name="ability">
        <option value="Q">Q</option>
        <option value="W">W</option>
        <option value="E">E</option>
        <option value="R">R</option>
    </select>

    <label for="abilityLevel">Ability Rank:</label>
    <select id="abilityLevel" name="abilityLevel">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
    </select>
</section>

<section>
    <h2>Defense</h2>

    <label for="defenseChampion">Champion:</label>
    <select id="defenseChampion" name="defenseChampion">
        <option value="">Select Champion</option>
    </select>

    <label for="defenseLevel">Level:</label>
    <select id="defenseLevel" name="defenseLevel">
        <option value="1">1</option>
        <option value="2">2</option>
        <!-- continue to 18 -->
    </select>
</section>

<button id="calculate">Calculate Damage</button>

<section>
    <h2>Results</h2>
    <p id="damageResult">Damage:</p>
    <p id="remainingHealthResult">Remaining Health:</p>
</section>
        <script src="script.js"></script>
    </body>
</html>
