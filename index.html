<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>LoL Damage Calculator</title>
    </head>
    <body>
        <h1>League of Legends Damage Calculator</h1>
        <h2>Select your champion (offense):</h2>
            <select id="offense champs" name="offense champs">
                <option>Ziggs</option>
        </select>
            <p>Level:</p>
            <select id="level" name="level">
                <option>1</option>
                <option>2</option>
                <option>3</option>
                <option>4</option>
                <option>5</option>
                <option>6</option>
                <option>7</option>
                <option>8</option>
                <option>9</option>
                <option>10</option>
                <option>11</option>
                <option>12</option>
                <option>13</option>
                <option>14</option>
                <option>15</option>
                <option>16</option>
                <option>17</option>
                <option>18</option>
            </select>

            <p>Ability:</p>
                <select id="ability" name="ability">
                    <option>Q</option>
                    <option>W</option>
                    <option>E</option>
                    <option>R</option>
                </select>
            <p>Ability Level:</p>
            <select id="ability level" name="ability level">
                <option>1</option>
                <option>2</option>
                <option>3</option>
                <option>4</option>
                <option>5</option>
            </select>
            <p>Items:</p>
            <select id="items" name="items">
                <option>Luden's Companion</option>
            </select>

        <h2>Select your champion (defense):</h2>
            <select id="defense champs" name="defense champs">
                <option>Leona</option>
            </select>
            
            <p>Level:</p>
            <select id="defense level" name="defense level">
                <option>1</option>
                <option>2</option>
                <option>3</option>
                <option>4</option>
                <option>5</option>
                <option>6</option>
                <option>7</option>
                <option>8</option>
                <option>9</option>
                <option>10</option>
                <option>11</option>
                <option>12</option>
                <option>13</option>
                <option>14</option>
                <option>15</option>
                <option>16</option>
                <option>17</option>
                <option>18</option>
            </select>
            <p>Items:</p>
    </body>
</html>
